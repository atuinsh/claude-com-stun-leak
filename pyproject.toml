[project]
name = "claude-com-stun-leak"
version = "0.1.0"
description = "Minimal STUN server for authorized WebRTC IP-leak verification"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stun-server = "stun_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["stun_server.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/probe.html",
    "/pyproject.toml",
    "/stun_server.py",
    "/uv.lock",
]

[dependency-groups]
dev = []
